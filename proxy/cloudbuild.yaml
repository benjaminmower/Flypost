options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Build proxy image
  - name: gcr.io/cloud-builders/docker
    id: build-proxy
    dir: proxy
    args:
      [
        "build",
        "-t",
        "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$SHORT_SHA",
        "-f",
        "Dockerfile",
        "."
      ]

  # 2) Push proxy image
  - name: gcr.io/cloud-builders/docker
    id: push-proxy
    args:
      [
        "push",
        "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$SHORT_SHA"
      ]

  # 3) Deploy proxy (resolve backend URL dynamically)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-proxy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REGION="us-west1"
        BACKEND_SERVICE="flypostv4"
        PROXY_SERVICE="proxyv4"

        echo "Resolving backend service URL (${BACKEND_SERVICE})..."
        BACKEND_URL="$(gcloud run services describe "${BACKEND_SERVICE}" --region "${REGION}" --format='value(status.url)')"
        if [[ -z "${BACKEND_URL}" ]]; then
          echo "ERROR: Could not resolve backend URL" >&2
          exit 1
        fi
        echo "Resolved BACKEND_URL=${BACKEND_URL}"

        echo "Deploying proxy service (${PROXY_SERVICE})..."
        gcloud run deploy "${PROXY_SERVICE}" \
          --image "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$SHORT_SHA" \
          --region "${REGION}" \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars BACKEND_URL=${BACKEND_URL},FRONTEND_ORIGIN=${_FRONTEND_ORIGIN},PROXY_USE_ID_TOKEN=${_PROXY_USE_ID_TOKEN}

substitutions:
  _FRONTEND_ORIGIN: "https://flypost.netlify.app"
  _PROXY_USE_ID_TOKEN: "true"

images:
  - "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$SHORT_SHA"
