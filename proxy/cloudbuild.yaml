# Proxy-only Cloud Build v9
# Builds and deploys the proxy service (proxyv4) to Cloud Run.
# Resolves backend service URL (flypostv4) each build.

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Build proxy image
  - name: gcr.io/cloud-builders/docker
    id: build-proxy
    dir: proxy
    args:
      [
        "build",
        "-t",
        "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$BUILD_ID",
        "-f",
        "Dockerfile",
        "."
      ]

  # 2) Push proxy image
  - name: gcr.io/cloud-builders/docker
    id: push-proxy
    args:
      [
        "push",
        "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$BUILD_ID"
      ]

  # 3) Deploy proxy
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-proxy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        region="us-west1"

        echo "Resolving backend service URL (flypostv4 in $region)..."
        backend_url="$(gcloud run services describe 'flypostv4' --region "$region" --format='value(status.url)')"
        if [[ -z "$backend_url" ]]; then
          echo "ERROR: Could not resolve backend URL" >&2
          exit 1
        fi
        echo "Resolved BACKEND_URL=$backend_url"

        echo "Deploying proxyv4..."
        gcloud run deploy proxyv4 \
          --image "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$BUILD_ID" \
          --region "$region" \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "BACKEND_URL=$backend_url,FRONTEND_ORIGIN=${_FRONTEND_ORIGIN},PROXY_USE_ID_TOKEN=${_PROXY_USE_ID_TOKEN}"

substitutions:
  _FRONTEND_ORIGIN: "https://app.goflypost.com"
  _PROXY_USE_ID_TOKEN: "true"

images:
  - "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$BUILD_ID"
