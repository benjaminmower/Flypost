# Proxy-only Cloud Build v6
# Builds and deploys the proxy service (proxyv4) to Cloud Run.
# Dynamically resolves backend service URL each build.

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1) Build proxy image
  - name: gcr.io/cloud-builders/docker
    id: build-proxy
    dir: proxy
    args:
      [
        "build",
        "-t",
        "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$SHORT_SHA",
        "-f",
        "Dockerfile",
        "."
      ]

  # 2) Push proxy image
  - name: gcr.io/cloud-builders/docker
    id: push-proxy
    args:
      [
        "push",
        "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$SHORT_SHA"
      ]

  # 3) Deploy proxy
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-proxy
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        REGION="${_REGION}"
        BACKEND_SERVICE="${_BACKEND_SERVICE}"

        echo "Resolving backend service URL ($BACKEND_SERVICE in $REGION)..."
        BACKEND_URL="$(gcloud run services describe "$BACKEND_SERVICE" --region "$REGION" --format='value(status.url)')"
        if [[ -z "$BACKEND_URL" ]]; then
          echo "ERROR: Could not resolve backend URL" >&2
          exit 1
        fi
        echo "Resolved BACKEND_URL=$BACKEND_URL"

        echo "Deploying proxyv4..."
        gcloud run deploy proxyv4 \
          --image "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$SHORT_SHA" \
          --region "$REGION" \
          --platform managed \
          --allow-unauthenticated \
          --set-env-vars "BACKEND_URL=$BACKEND_URL,FRONTEND_ORIGIN=${_FRONTEND_ORIGIN},PROXY_USE_ID_TOKEN=${_PROXY_USE_ID_TOKEN}"

substitutions:
  _FRONTEND_ORIGIN: "https://flypost.netlify.app"
  _PROXY_USE_ID_TOKEN: "true"
  _BACKEND_SERVICE: "flypostv4"
  _REGION: "us-west1"

images:
  - "us-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/v4/proxyv4:$SHORT_SHA"
