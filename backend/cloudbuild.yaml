steps:
# Build the container and push to Google Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/goflypost-backend:$SHORT_SHA', '.']
  dir: 'backend'
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/goflypost-backend:$SHORT_SHA']
# Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run deploy flypostv4 \
        --image gcr.io/$PROJECT_ID/goflypost-backend:$SHORT_SHA \
        --region=${_REGION:-us-west1} \
        --platform=managed \
        --set-env-vars NODE_ENV=production,PORT=8080,FRONTEND_URL=${_FRONTEND_URL} \
        --update-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest
substitutions:
  _REGION: 'us-west1'
  _FRONTEND_URL: 'https://app.goflypost.com'
images:
- 'gcr.io/$PROJECT_ID/goflypost-backend:$SHORT_SHA'
