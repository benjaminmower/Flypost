steps:
# Build the container and push to Google Container Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/goflypost-backend:$SHORT_SHA', '.']
  dir: 'backend'
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/goflypost-backend:$SHORT_SHA']
# Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run deploy goflypost-backend \
        --image gcr.io/$PROJECT_ID/goflypost-backend:$SHORT_SHA \
        --region=${_REGION:-us-central1} \
        --platform=managed \
        --allow-unauthenticated \
        --set-env-vars NODE_ENV=test,PORT=8080,FRONTEND_URL=${_FRONTEND_URL}
substitutions:
  _REGION: 'us-central1'
  _FRONTEND_URL: 'https://YOUR_NETLIFY_SITE.netlify.app'
images:
- 'gcr.io/$PROJECT_ID/goflypost-backend:$SHORT_SHA'
