<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLYPOST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .input-textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s ease;
        }
        
        .input-textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .parse-button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        
        .parse-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .parse-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .result-panel {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #28a745;
        }
        
        .result-panel.error {
            border-left-color: #dc3545;
            background: #fff5f5;
        }
        
        .result-panel.hidden {
            display: none;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .result-title {
            font-weight: 600;
            color: #333;
        }
        
        .copy-button {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        
        .copy-button:hover {
            background: #218838;
        }
        
        .result-content {
            background: white;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e1e5e9;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.4;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* Horizontal scroll lane for event cards */
        .horizontal-scroll {
            display: flex;
            flex-direction: row;
            gap: 16px;
            overflow-x: auto;
            padding: 10px 0 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        /* Event cards */
        .event-item {
            min-width: 320px;
            max-width: 320px;
            max-height: 260px;
            flex: 0 0 auto;
            background: white;
            border: 1px solid #e1e5e9;
            border-radius: 10px;
            padding: 14px 14px 10px;
            scroll-snap-align: start;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .event-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
        }

        .event-item h4 {
            color: #222;
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: 600;
        }
        
        .event-item p {
            color: #555;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-line;
            overflow-y: auto;
            padding-right: 4px;
        }

        .horizontal-scroll::-webkit-scrollbar {
            height: 8px;
        }

        .horizontal-scroll::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.25);
            border-radius: 4px;
        }
        
        .status {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Modal for full event details */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 10px;
            max-width: 480px;
            width: 100%;
            padding: 24px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-close {
            border: none;
            background: transparent;
            font-size: 20px;
            position: absolute;
            top: 12px;
            right: 12px;
            cursor: pointer;
        }

        .modal-share {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        .modal-share:hover {
            background: #5463d3;
        }

        .modal-content h2 {
            margin-bottom: 6px;
            font-size: 18px;
            color: #222;
        }

        #modal-meta {
            font-size: 13px;
            color: #555;
            margin-bottom: 12px;
            white-space: pre-line;
        }

        #modal-description {
            font-size: 14px;
            line-height: 1.6;
            color: #444;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FLYPOST</h1>
            <p>the worlds first AI native event feed</p>
        </div>

        <!-- Passwordless Sign-In Panel -->
        <div id="auth-panel" style="margin-bottom:20px; padding:15px; border:1px solid #e1e5e9; border-radius:6px; background:#fff;">
            <h3 style="margin-top:0; margin-bottom:10px;">Sign in to Flypost (Passwordless)</h3>
            <p style="margin:0 0 10px; font-size:13px; color:#555;">
                Enter your email to get a magic link. You must be signed in to post events.
            </p>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <input 
                    type="email" 
                    id="auth-email" 
                    placeholder="you@example.com"
                    style="flex:1; padding:10px; border:1px solid #ccc; border-radius:4px;"
                    autocomplete="email"
                />
                <button id="send-link-btn" type="button" class="copy-button" style="background:#007bff;">
                    ✉️ Send Magic Link
                </button>
                <button id="signout-btn" type="button" class="copy-button" style="background:#6c757d; display:none;">
                    🚪 Sign Out
                </button>
            </div>
            <div id="auth-status" style="margin-top:10px; font-size:13px; color:#555;"></div>
        </div>
        
        <form id="event-form">
            <div class="form-group">
                <label for="event-text">Event Description</label>
                <textarea 
                    id="event-text" 
                    class="input-textarea"
                    placeholder="Enter event description in natural language..."
                    required></textarea>
            </div>
            
            <button type="submit" id="parse-btn" class="parse-button">
                🤖 Parse & Publish Event
            </button>
        </form>
        
        <div id="result-panel" class="result-panel hidden">
            <div class="result-header">
                <span class="result-title" id="result-title">Parsed Event</span>
                <button id="copy-btn" class="copy-button">📋 Copy JSON</button>
            </div>
            <div id="result-content" class="result-content"></div>
        </div>
        
        <div id="status" class="status hidden"></div>
        
        <div class="events-panel">
            <h3>Recent Events</h3>

            <!-- Horizontal scroll list -->
            <div id="events-list" class="horizontal-scroll">
                <p style="color: #666; font-style: italic;">No events yet. Parse your first event above!</p>
            </div>

            <button id="refresh-events" class="copy-button" style="margin-top: 10px; background: #17a2b8;">
                🔄 Refresh Events
            </button>
        </div>
    </div>

    <!-- Event Modal -->
    <div id="event-modal" class="modal hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">✕</button>
        <h2 id="modal-title"></h2>
        <div id="modal-meta"></div>
        <p id="modal-description"></p>
        <button id="modal-share" class="modal-share">📤 Share This</button>
      </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
