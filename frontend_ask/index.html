<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flypost | Ask Flypost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { ink_black: '#060810', hot_berry: '#d82e7e', dark_amethyst: '#2f195f', mint_leaf: '#40c9a2', bright_snow: '#f7f7f7', lemon_lime: '#e0e03e', air_force_blue: '#628395' } } } }
    </script>
    <style>
        body { background-color: #060810; color: #f7f7f7; font-family: ui-sans-serif, system-ui, sans-serif; }
        .bg-glow { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100vw; height: 100vh; background: radial-gradient(circle at 50% -20%, #1d3a33 0%, #060810 80%); z-index: -1; }
        .text-glow { background: linear-gradient(to right, #40c9a2, #f7f7f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Chat transcript styles */
        #chat-transcript { 
            max-height: 500px; 
            overflow-y: auto; 
            margin-top: 2rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        #chat-transcript::-webkit-scrollbar { width: 8px; }
        #chat-transcript::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 4px; }
        #chat-transcript::-webkit-scrollbar-thumb { background: rgba(64, 201, 162, 0.3); border-radius: 4px; }
        #chat-transcript::-webkit-scrollbar-thumb:hover { background: rgba(64, 201, 162, 0.5); }
        
        .message { 
            padding: 1rem 1.25rem; 
            border-radius: 1rem;
            max-width: 85%;
            word-wrap: break-word;
        }
        .message.user { 
            background-color: rgba(64, 201, 162, 0.15);
            border: 1px solid rgba(64, 201, 162, 0.3);
            align-self: flex-end;
            margin-left: auto;
        }
        .message.assistant { 
            background-color: rgba(98, 131, 149, 0.1);
            border: 1px solid rgba(98, 131, 149, 0.3);
            align-self: flex-start;
        }
        .message.system { 
            background-color: rgba(224, 224, 62, 0.1);
            border: 1px solid rgba(224, 224, 62, 0.3);
            align-self: center;
            font-size: 0.875rem;
            font-style: italic;
            text-align: center;
            max-width: 90%;
        }
        .message.error { 
            background-color: rgba(216, 46, 126, 0.1);
            border: 1px solid rgba(216, 46, 126, 0.3);
            align-self: center;
            max-width: 90%;
        }
        
        /* Markdown rendering styles */
        .message.assistant h1, .message.assistant h2, .message.assistant h3 { 
            margin-top: 0.75rem; 
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .message.assistant h1 { font-size: 1.5rem; }
        .message.assistant h2 { font-size: 1.25rem; }
        .message.assistant h3 { font-size: 1.1rem; }
        .message.assistant p { margin: 0.5rem 0; }
        .message.assistant ul, .message.assistant ol { 
            margin: 0.5rem 0; 
            padding-left: 1.5rem;
        }
        .message.assistant li { margin: 0.25rem 0; }
        .message.assistant code { 
            background-color: rgba(0, 0, 0, 0.3);
            padding: 0.125rem 0.25rem;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.875em;
        }
        .message.assistant pre { 
            background-color: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }
        .message.assistant pre code { 
            background-color: transparent;
            padding: 0;
        }
        .message.assistant table { 
            border-collapse: collapse;
            margin: 0.5rem 0;
            width: 100%;
        }
        .message.assistant th, .message.assistant td { 
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem;
            text-align: left;
        }
        .message.assistant th { 
            background-color: rgba(64, 201, 162, 0.2);
            font-weight: 700;
        }
        .message.assistant a { 
            color: #40c9a2;
            text-decoration: underline;
        }
        .message.assistant blockquote { 
            border-left: 3px solid rgba(64, 201, 162, 0.5);
            padding-left: 1rem;
            margin: 0.5rem 0;
            font-style: italic;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-glow"></div>

    <nav class="absolute top-12 w-full flex justify-center items-center gap-4 md:gap-8">
        <div class="text-4xl font-black text-mint_leaf uppercase tracking-tighter transform rotate-[2deg]">ASK</div>
        <a href="https://presence.goflypost.com" class="text-sm font-bold text-air_force_blue-800 opacity-40 hover:opacity-100 transition-all uppercase tracking-widest">Presence</a>
        <div class="font-black text-3xl tracking-tighter text-lemon_lime border-x border-white/10 px-4 md:px-6">FLYPOST</div>
        <a href="https://post.goflypost.com" class="text-sm font-bold text-air_force_blue-800 opacity-40 hover:opacity-100 transition-all uppercase tracking-widest">Post</a>
    </nav>

    <main class="max-w-3xl mt-20 w-full">
        <h1 class="text-6xl md:text-8xl font-bold mb-6 tracking-tighter">Search with <span class="text-glow">Intelligence.</span></h1>
        <p class="text-air_force_blue-700 text-lg mb-12">The intelligent open house assistant. Ask anything about listings instantly.</p>
        
        <!-- Chat transcript container -->
        <div id="chat-transcript" class="max-w-xl mx-auto"></div>
        
        <!-- Chat input form -->
        <form id="chat-form" class="bg-white/5 border border-mint_leaf/30 p-2 rounded-2xl flex max-w-xl mx-auto mt-4">
            <input id="chat-input" type="text" placeholder="Find me a home..." class="bg-transparent flex-grow p-4 focus:outline-none text-white">
            <button id="chat-button" type="submit" class="bg-mint_leaf text-ink_black px-6 py-2 rounded-xl font-bold hover:bg-mint_leaf/90 transition">Ask AI</button>
        </form>
    </main>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
