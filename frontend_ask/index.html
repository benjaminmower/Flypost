<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO / Open Graph -->
    <title>Flypost Ask | Discover Open Houses Near You</title>
    <link rel="canonical" href="https://ask.goflypost.com/" />
    <meta name="description" content="Flypost Ask helps you discover open houses and local events near a location. Read-only discovery backed by the Flypost event registry." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ask.goflypost.com/" />
    <meta property="og:title" content="Flypost Ask | Discover Open Houses Near You" />
    <meta property="og:description" content="Search open houses and real estate events near a location. Read-only discovery backed by Flypost." />
    <meta property="og:image" content="https://cdn.prod.website-files.com/641b71cdf89f2834a1aff9a6/695eaeeb6687c3be030ba5dd_3bade265ff941b27916be3edc7ae7ea0_flypost-ground-truth-registry-og.png.png" />
    
    <link rel="icon" href="https://cdn.prod.website-files.com/641b71cdf89f2834a1aff9a6/695ede7b8886a78233b55308_6683234a1ee80c5f2891597e_Flypost%20Logo-256px-3.png" type="image/png">

    <link rel="apple-touch-icon" href="https://cdn.prod.website-files.com/641b71cdf89f2834a1aff9a6/695ede7b8886a78233b55308_6683234a1ee80c5f2891597e_Flypost%20Logo-256px-3.png">

    <link rel="shortcut icon" href="https://cdn.prod.website-files.com/641b71cdf89f2834a1aff9a6/695ede7b8886a78233b55308_6683234a1ee80c5f2891597e_Flypost%20Logo-256px-3.png" type="image/x-icon">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Flypost Ask",
      "applicationCategory": "SearchApplication",
      "description": "Conversational query engine for the Flypost Event Registry.",
      "author": {
        "@type": "Organization",
        "name": "Flypost",
        "url": "https://goflypost.com"
      }
    }
    </script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink_black: '#060810',
                        hot_berry: '#d82e7e',
                        dark_amethyst: '#2f195f',
                        mint_leaf: '#40c9a2',
                        bright_snow: '#f7f7f7',
                        lemon_lime: '#e0e03e',
                        air_force_blue: '#628395'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #060810; color: #f7f7f7; font-family: ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .bg-glow { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 15%, #1d3a33 0%, #060810 80%); z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); }
        #chat-transcript::-webkit-scrollbar { width: 4px; }
        #chat-transcript::-webkit-scrollbar-thumb { background: rgba(64, 201, 162, 0.2); border-radius: 10px; }
        /* Clamped scale: Mobile is punchy but fits; Desktop is massive. */
        .text-hero { font-size: clamp(2.4rem, 11vw, 8.5rem); letter-spacing: -0.04em; }
        
        /* Message bubbles */
        .message {
            padding: 16px;
            margin: 8px 0;
            border-radius: 12px;
            line-height: 1.6;
        }
        .message.user {
            background: rgba(64, 201, 162, 0.1);
            border: 1px solid rgba(64, 201, 162, 0.3);
            text-align: right;
            margin-left: auto;
            max-width: 80%;
        }
        .message.assistant {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
        }
        .message.system {
            background: rgba(98, 131, 149, 0.1);
            border: 1px solid rgba(98, 131, 149, 0.2);
            text-align: center;
            font-size: 0.9em;
            opacity: 0.8;
        }
        .message.error {
            background: rgba(216, 46, 126, 0.1);
            border: 1px solid rgba(216, 46, 126, 0.3);
            color: #ff6b9d;
        }
        
        /* Property card animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Property card styling */
        .property-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(64, 201, 162, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin: 16px 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), 0 0 40px rgba(64, 201, 162, 0.05);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
        }
        
        .property-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4), 0 0 60px rgba(64, 201, 162, 0.15);
            border-color: rgba(64, 201, 162, 0.4);
        }
        
        /* Property card typography */
        .property-card h3 {
            color: #40c9a2;
            font-size: 1.25em;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        
        .property-card strong {
            color: #f7f7f7;
        }
        
        .property-card em {
            color: rgba(247, 247, 247, 0.7);
            font-style: italic;
        }
        
        .property-card a {
            color: #40c9a2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .property-card a:hover {
            color: #e0e03e;
            text-decoration: underline;
        }
        
        .property-card ul {
            list-style: none;
            padding: 0;
            margin: 12px 0;
        }
        
        .property-card li {
            margin: 8px 0;
            line-height: 1.5;
        }
        
        /* Badge styling */
        .distance-badge, .price-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 700;
            margin-left: 8px;
            white-space: nowrap;
        }
        
        /* Distance badge colors */
        .distance-badge.distance-close {
            background: rgba(64, 201, 162, 0.2);
            color: #40c9a2;
            border: 1px solid rgba(64, 201, 162, 0.4);
        }
        
        .distance-badge.distance-medium {
            background: rgba(224, 224, 62, 0.2);
            color: #e0e03e;
            border: 1px solid rgba(224, 224, 62, 0.4);
        }
        
        .distance-badge.distance-far {
            background: rgba(98, 131, 149, 0.2);
            color: #628395;
            border: 1px solid rgba(98, 131, 149, 0.4);
        }
        
        /* Price badge colors */
        .price-badge.price-low {
            background: rgba(64, 201, 162, 0.2);
            color: #40c9a2;
            border: 1px solid rgba(64, 201, 162, 0.4);
        }
        
        .price-badge.price-mid {
            background: rgba(98, 131, 149, 0.2);
            color: #90b8d0;
            border: 1px solid rgba(98, 131, 149, 0.4);
        }
        
        .price-badge.price-high {
            background: rgba(146, 82, 161, 0.2);
            color: #b084cc;
            border: 1px solid rgba(146, 82, 161, 0.4);
        }
        
        /* Property detail with icons */
        .property-detail {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .property-detail-icon {
            font-size: 1em;
        }
        
        /* Mobile responsive adjustments */
        @media (max-width: 640px) {
            .property-card {
                padding: 16px;
                margin: 12px 0;
            }
            
            .property-card h3 {
                font-size: 1.1em;
            }
            
            .distance-badge, .price-badge {
                font-size: 0.75em;
                padding: 3px 8px;
            }
        }
        
        /* Accessibility: Disable animations for users who prefer reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .property-card {
                animation: none;
                opacity: 1;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-10 text-center justify-start">
    <div class="bg-glow"></div>

    <header class="flex flex-col items-center pt-10 md:pt-16 pb-6 md:pb-12 w-full max-w-6xl">
        <a href="https://goflypost.com" class="group transition-all">
                <div class="font-black text-3xl md:text-4xl tracking-tighter text-bright_snow group-hover:text-lemon_lime/80 transition-all duration-300">
                    FLYPOST
                </div>
            </a>
        
        <div class="w-full max-w-[100px] md:max-w-[320px] border-t border-white/20 mb-4 md:mb-10"></div>
        
        <div class="w-full flex flex-col items-center">
            
            <div class="flex md:hidden w-full max-w-[180px] justify-between items-center mb-1">
                <a href="https://presence.goflypost.com" class="text-[10px] font-bold text-air_force_blue-800 opacity-20 uppercase tracking-[0.3em]">Presence</a>
                <a href="https://post.goflypost.com" class="text-[10px] font-bold text-air_force_blue-800 opacity-20 uppercase tracking-[0.3em]">Post</a>
            </div>
            <h1 class="block md:hidden text-hero font-black text-mint_leaf uppercase leading-none">Ask</h1>

            <div class="hidden md:flex items-center justify-between w-full px-12 gap-4">
                <a href="https://presence.goflypost.com" class="text-xs font-bold text-air_force_blue-800 opacity-20 hover:opacity-100 transition-all uppercase tracking-[0.3em] w-1/4 text-right">Presence</a>
                <h1 class="text-hero font-black text-mint_leaf uppercase w-2/4 leading-tight">Ask</h1>
                <a href="https://post.goflypost.com" class="text-xs font-bold text-air_force_blue-800 opacity-20 hover:opacity-100 transition-all uppercase tracking-[0.3em] w-1/4 text-left">Post</a>
            </div>
        </div>
    </header>

    <main class="max-w-2xl w-full mt-2 md:mt-8 px-2 flex flex-col h-full">
        <div id="chat-transcript" class="flex-grow overflow-y-auto space-y-4 mb-6 min-h-[300px] px-2">
            </div>
        
        <form id="chat-form" class="glass-card p-2 rounded-2xl flex border-mint_leaf/10 shadow-2xl">
            <input id="chat-input" type="text" placeholder="Search with Intelligence..." class="bg-transparent flex-grow p-4 focus:outline-none text-white text-sm md:text-lg">
            <button id="chat-button" type="submit" class="bg-mint_leaf text-ink_black px-6 md:px-8 py-3 rounded-xl font-bold uppercase tracking-tight active:scale-95 transition-transform">Ask AI</button>
        </form>
    </main>

    <footer class="mt-auto py-10 opacity-20">
        <p class="text-[8px] uppercase tracking-[0.5em] text-air_force_blue-900 font-bold">Flypost // 2026</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
