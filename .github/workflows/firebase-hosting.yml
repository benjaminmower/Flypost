name: Build and deploy concierge-widget to Firebase Hosting (OIDC)
on:
  push:
    branches:
      - main
    paths:
      - "**/concierge-widget.js"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "yarn.lock"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-hosting.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/498798854474/locations/global/workloadIdentityPools/github-actions/providers/github"
          service_account: "github-actions-deployer@goflypost.iam.gserviceaccount.com"

      - name: Detect package manager
        id: detect-pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-pm.outputs.manager }}

      - name: Install widget dependencies
        run: npm ci
        working-directory: concierge/widget

      - name: Build concierge-widget
        run: npm run build
        working-directory: concierge/widget

      - name: Locate concierge-widget files
        shell: bash
        run: |
          set -e
          WIDGET_JS="$(git ls-files | grep -E 'concierge-widget\.js$' | head -n1)"
          WIDGET_CSS="$(git ls-files | grep -E 'concierge-widget\.css$' | head -n1)"
          if [ -z "$WIDGET_JS" ]; then
            echo "concierge-widget.js not found. Ensure the file is committed."
            exit 1
          fi
          if [ -z "$WIDGET_CSS" ]; then
            echo "concierge-widget.css not found. Ensure the file is committed."
            exit 1
          fi
          echo "WIDGET_JS=$WIDGET_JS" >> "$GITHUB_ENV"
          echo "WIDGET_CSS=$WIDGET_CSS" >> "$GITHUB_ENV"

      - name: Prepare hosting files
        shell: bash
        run: |
          set -e
          mkdir -p public
          # Copy widget JavaScript (use source file, build doesn't produce a JS artifact)
          cp "$WIDGET_JS" public/concierge-widget.js
          # Copy widget CSS
          cp "$WIDGET_CSS" public/concierge-widget.css
          ls -lah public

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Deploy to Firebase Hosting (OIDC)
        run: firebase deploy --only hosting --project goflypost --non-interactive
