<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista Sotheby's International Realty - Open Houses</title>
  
  <!-- Flypost Concierge Widget Styles -->
  <link rel="stylesheet" href="../concierge-widget.css">
  <link rel="stylesheet" href="../../themes/vista-sir.css">
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Georgia, 'Times New Roman', serif;
      background: #f5f5f5;
    }
    
    .page-header {
      max-width: 600px;
      margin: 0 auto 20px auto;
      text-align: center;
    }
    
    .page-header h1 {
      font-size: 32px;
      color: #1a1a1a;
      margin: 0 0 10px 0;
    }
    
    .page-header p {
      font-size: 16px;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>Vista Sotheby's International Realty</h1>
    <p>Discover Our Exclusive Open Houses</p>
  </div>

  <!-- Flypost Concierge Container -->
  <div id="flypost-concierge-container"></div>

  <!-- Configure the widget -->
  <script>
    window.FLYPOST_CONFIG = {
      apiBase: 'https://api.goflypost.com',
      brokerageId: 'vista-sir',
      branding: {
        name: 'Vista Sotheby\'s International Realty',
        primaryColor: '#1a1a1a',
        accentColor: '#c9a962',
        logo: 'https://assets.goflypost.com/logos/vista-sir.png',
        headerText: 'Discover Vista Sotheby\'s Open Houses'

    };

  <!-- Load the widget -->
  <script src="../concierge-widget.js"></script>
