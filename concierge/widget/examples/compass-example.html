<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass Real Estate - Open Houses</title>
  
  <!-- Flypost Concierge Widget Styles -->
  <link rel="stylesheet" href="../concierge-widget.css">
  <link rel="stylesheet" href="../../themes/compass.css">
  
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f9f9f9;
    }
    
    .page-header {
      max-width: 600px;
      margin: 0 auto 20px auto;
      text-align: center;
    }
    
    .page-header h1 {
      font-size: 32px;
      color: #000;
      margin: 0 0 10px 0;
    }
    
    .page-header p {
      font-size: 16px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>Compass Real Estate</h1>
    <p>Find Your Next Home</p>
  </div>

  <!-- Flypost Concierge Container -->
  <div id="flypost-concierge-container"></div>

  <!-- Configure the widget -->
  <script>
    window.FLYPOST_CONFIG = {
      apiBase: 'https://api.goflypost.com',
      brokerageId: 'compass',
      branding: {
        name: 'Compass',
        primaryColor: '#d82327',
        accentColor: '#b01d20',
        logo: 'https://assets.goflypost.com/logos/compass.png',
        headerText: 'Discover Compass Open Houses'
      }
    };
  </script>
  
  <!-- Load the widget -->
  <script src="../concierge-widget.js"></script>
</body>
</html>
