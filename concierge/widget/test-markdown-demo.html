<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flypost Concierge - Markdown Demo</title>
  <link rel="stylesheet" href="concierge-widget.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 20px;
      background: #f0f2f5;
    }
    .demo-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .demo-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .demo-header h1 {
      color: #333;
      margin: 0;
    }
    .demo-header p {
      color: #666;
      margin: 10px 0;
    }
    .demo-content {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="demo-header">
      <h1>🗓️ Flypost Concierge Widget</h1>
      <p>Markdown Rendering Demo</p>
    </div>
    
    <div id="flypost-concierge-container"></div>
    
    <script>
      // Configuration for the widget
      window.FLYPOST_CONFIG = {
        apiBase: 'http://localhost:3001',
        brokerageId: 'demo-brokerage',
        branding: {
          name: 'Demo Realty',
          primaryColor: '#667eea',
          accentColor: '#764ba2',
          logo: null,
          headerText: 'Discover Local Open Houses'
        }
      };
    </script>
    <script src="concierge-widget.js"></script>
    
    <!-- Demo: Inject a sample Markdown response -->
    <script>
      setTimeout(() => {
        // Demo Markdown content
        const markdownDemo = `## Open Houses This Weekend

Here are **3 beautiful properties** available in Santa Monica:

### 🏠 Property 1: 123 Ocean Avenue

- **Open House**: Saturday, Dec 14 · 1:00-4:00 PM
- **Price**: $2,495,000
- **Details**: 4 beds · 3.5 baths · 2,800 sqft
- **Distance**: 0.5 miles (~2 min drive, ~10 min walk)

*Stunning coastal home with panoramic ocean views and modern finishes.*

**Key Features**:
- Ocean views from every room
- Chef's kitchen with top appliances
- Private rooftop deck

**Agent**: Sarah Johnson · 📞 (310) 555-0123 · Coastal Realty

---

### 🏠 Property 2: 456 Main Street

- **Open House**: Saturday, Dec 14 · 2:00-5:00 PM
- **Price**: $1,850,000
- **Details**: 3 beds · 2.5 baths · 2,200 sqft
- **Distance**: 1.2 miles (~5 min drive, ~24 min walk)

*Charming California bungalow with backyard oasis.*

**Key Features**:
- Updated throughout
- Beautiful landscaping
- Two-car garage

**Agent**: Michael Chen · 📞 (310) 555-0456 · Demo Realty

---

## 📊 Property Comparison

| Property | Price | Beds | Baths | Sqft | Price/Sqft | Distance |
|----------|-------|------|-------|------|------------|----------|
| 123 Ocean Ave | $2.49M | 4 | 3.5 | 2,800 | $891 | 0.5 mi |
| 456 Main St | $1.85M | 3 | 2.5 | 2,200 | $841 | 1.2 mi |

⚠️ **Travel Time Note**: Estimates based on typical driving (~25 mph urban) and walking (~3 mph) speeds. Actual times vary with traffic and route conditions.

## 💡 What would you like to know?

- Tell me more about 123 Ocean Avenue
- Are there any open houses on Sunday?
- Show me properties under $2M
- What neighborhoods should I explore?`;

        // Simulate adding the message to the widget
        const messagesContainer = document.getElementById('flypost-messages');
        if (messagesContainer) {
          const messageDiv = document.createElement('div');
          messageDiv.className = 'flypost-message assistant';
          messageDiv.innerHTML = marked.parse(markdownDemo);
          messagesContainer.appendChild(messageDiv);
          messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
      }, 1000);
    </script>
  </div>
</body>
</html>
