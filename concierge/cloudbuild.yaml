options:
  logging: CLOUD_LOGGING_ONLY # Log output is sent only to Cloud Logging

steps:
  # Step 1: Build the Docker image for the Concierge service
  - name: 'gcr.io/cloud-builders/docker'
    id: build-concierge
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/github.com/goflypost/v4/concierge:$SHORT_SHA", # Tag the image using commit SHA
        "-f",
        "widget/Dockerfile", # Location of the Dockerfile relative to the 'concierge' folder
        "widget",            # Build context
      ]
    dir: 'v4/concierge' # Start building from the 'v4/concierge' directory

  # Step 2: Push the Docker image to Google Container Registry (or Artifact Registry)
  - name: 'gcr.io/cloud-builders/docker'
    id: push-concierge
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/github.com/goflypost/v4/concierge:$SHORT_SHA",
      ]

  # Step 3: Deploy the Concierge service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-concierge
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "flypost-concierge", # Name of the Cloud Run service
        "--image", "gcr.io/$PROJECT_ID/github.com/goflypost/v4/concierge:$SHORT_SHA", # Image to deploy
        "--region", "us-west1", # Deployment region
        "--platform", "managed",
        "--allow-unauthenticated", # Allow public access to the Concierge service
      ]

# Optional: Outputs the final Docker image location
images:
  - "gcr.io/$PROJECT_ID/github.com/goflypost/v4/concierge:$SHORT_SHA"
