options:
  logging: CLOUD_LOGGING_ONLY # Logs sent only to Cloud Logging

steps:
  # Step 1: Build the Docker image for the Concierge service
  - name: 'gcr.io/cloud-builders/docker'
    id: build-concierge
    args:
      [
        "build",
        "-t",
        "gcr.io/$PROJECT_ID/github.com/goflypost/v4/concierge:$SHORT_SHA", # Use commit SHA to tag the image
        "-f",
        "widget/Dockerfile", # Dockerfile path (inside widget directory)
        "widget",            # Build context (widget folder)
      ]
    dir: 'v4/concierge' # Top-level working directory for build

  # Step 2: Push the Docker image to GCR
  - name: 'gcr.io/cloud-builders/docker'
    id: push-concierge
    args:
      [
        "push",
        "gcr.io/$PROJECT_ID/github.com/goflypost/v4/concierge:$SHORT_SHA",
      ]

  # Step 3: Deploy the Docker image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-concierge
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "flypost-concierge", # Name of the Cloud Run service
        "--image", "gcr.io/$PROJECT_ID/github.com/goflypost/v4/concierge:$SHORT_SHA", # Deployed image
        "--region", "us-west1", # Deployment region
        "--platform", "managed",
        "--allow-unauthenticated", # Make publicly accessible
      ]

# Optional: Outputs the Docker image
images:
  - "gcr.io/$PROJECT_ID/github.com/goflypost/v4/concierge:$SHORT_SHA"
