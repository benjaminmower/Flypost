<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO / Open Graph -->
    <title>Flypost | Ground Truth Registry</title>
    <link rel="canonical" href="https://presence.goflypost.com/" />
    <meta name="description" content="Flypost Presence verifies real-world visits with time + location and captures immediate buyer intent. Ground-truth proof of life for open houses." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://presence.goflypost.com/" />
    <meta property="og:title" content="Flypost | Ground Truth Registry" />
    <meta property="og:description" content="Verifying physical intent through proof-of-life protocol. Recording what actually happened." />
    <meta property="og:image" content="https://cdn.prod.website-files.com/641b71cdf89f2834a1aff9a6/695eaeeb6687c3be030ba5dd_3bade265ff941b27916be3edc7ae7ea0_flypost-ground-truth-registry-og.png.png" />
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Flypost Presence",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Web, Mobile",
      "description": "The Flypost Presence Protocol verifies physical intent through geospatial and temporal gating.",
      "author": {
        "@type": "Organization",
        "name": "Flypost",
        "url": "https://goflypost.com"
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink_black: '#060810',
                        hot_berry: '#d82e7e',
                        dark_amethyst: '#2f195f',
                        mint_leaf: '#40c9a2',
                        lemon_lime: '#e0e03e',
                        bright_snow: '#f7f7f7',
                        air_force_blue: '#628395'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #060810; color: #f7f7f7; font-family: ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .bg-glow { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 15%, #1e1b4b 0%, #060810 80%); z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); }
        .hidden { display: none; }
        .thumb-active { opacity: 1 !important; filter: grayscale(0) !important; transform: scale(1.2); }
        /* Clamped scale: Mobile is punchy but fits; Desktop is massive. */
        .text-hero { font-size: clamp(2.4rem, 11vw, 8.5rem); letter-spacing: -0.04em; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 md:p-10 text-center justify-start">
    <div class="bg-glow"></div>

    <header class="flex flex-col items-center pt-10 md:pt-16 pb-6 md:pb-12 w-full max-w-6xl">
        <div class="font-black text-3xl md:text-4xl tracking-tighter text-bright_snow transition-all">
            FLYPOST
        </div>
        
        <div class="w-full max-w-[100px] md:max-w-[320px] border-t border-white/10 mb-4 md:mb-10"></div>
        
        <div class="w-full flex flex-col items-center">
            
            <div class="flex md:hidden w-full max-w-[180px] justify-between items-center mb-1">
                <a href="https://ask.goflypost.com" class="text-[10px] font-bold text-air_force_blue-800 opacity-20 uppercase tracking-[0.3em]">Ask</a>
                <a href="https://post.goflypost.com" class="text-[10px] font-bold text-air_force_blue-800 opacity-20 uppercase tracking-[0.3em]">Post</a>
            </div>
            <h1 class="block md:hidden text-hero font-black text-lemon_lime uppercase leading-none">Presence</h1>

            <div class="hidden md:flex items-center justify-between w-full px-12 gap-4">
                <a href="https://ask.goflypost.com" class="text-xs font-bold text-air_force_blue-800 opacity-20 hover:opacity-100 transition-all uppercase tracking-[0.3em] w-1/4 text-right">Ask</a>
                <h1 class="text-hero font-black text-lemon_lime uppercase w-2/4 leading-tight">Presence</h1>
                <a href="https://post.goflypost.com" class="text-xs font-bold text-air_force_blue-800 opacity-20 hover:opacity-100 transition-all uppercase tracking-[0.3em] w-1/4 text-left">Post</a>
            </div>
            
        </div>
    </header>

    <main class="max-w-md md:max-w-xl w-full mt-2 md:mt-8 px-2">
        <div id="view-checkin" class="glass-card p-8 md:p-12 rounded-[2.5rem] md:rounded-[3.5rem] border-lemon_lime/10 shadow-2xl">
            <h2 class="text-xl md:text-3xl font-bold mb-4 italic tracking-tight opacity-90">Arrived?</h2>
            <p class="text-air_force_blue-700 text-sm md:text-lg mb-8 md:mb-12 opacity-70">Check in to receive property details.</p>
            
            <button id="btn-checkin" class="w-full bg-lemon_lime text-ink_black py-5 md:py-7 rounded-2xl md:rounded-3xl font-black text-xl md:text-3xl shadow-xl shadow-lemon_lime/20 active:scale-95 transition-all uppercase tracking-tight">
                Check In Now
            </button>
            
            <p id="status-msg" class="mt-6 text-[9px] uppercase tracking-[0.2em] text-air_force_blue-900 font-bold min-h-[14px]"></p>
        </div>

        <div id="view-success" class="hidden">
            <h2 class="text-3xl md:text-5xl font-black mb-10 tracking-tighter uppercase">Checked In.</h2>
            <div class="space-y-4 px-6">
                <button id="btn-copy-link" class="w-full glass-card py-5 rounded-2xl font-bold">Copy Link</button>
                <a id="sms-link" href="#" class="block w-full bg-hot_berry py-5 rounded-2xl font-bold text-bright_snow shadow-xl">Text Link</a>
                <button id="btn-open-feedback" class="w-full border border-white/5 py-3 rounded-xl font-bold text-air_force_blue-800 text-[10px] uppercase tracking-widest">Feedback</button>
            </div>
        </div>

        <div id="view-feedback" class="hidden glass-card p-10 rounded-[2.5rem] mt-6 text-left border-white/5">
             <h2 class="text-2xl md:text-3xl font-black mb-8 uppercase tracking-tighter">Feedback</h2>
             
             <!-- Question 1: Would you buy this house? (3-way) -->
             <p class="text-lg md:text-xl font-bold mb-4 text-center">Would you buy this house?</p>
             <input id="feedback-wouldBuy" type="hidden" value="" />
             <div class="flex justify-center gap-8 mb-10">
                 <button id="buy-yes" type="button" class="text-5xl opacity-20 grayscale transition-all duration-300" title="Yes">👍</button>
                 <button id="buy-maybe" type="button" class="text-5xl opacity-20 grayscale transition-all duration-300" title="Maybe">🤷</button>
                 <button id="buy-no" type="button" class="text-5xl opacity-20 grayscale transition-all duration-300" title="No">👎</button>
             </div>
             
             <!-- Question 2: Want to see similar homes? (2-way) -->
             <p class="text-lg md:text-xl font-bold mb-4 text-center">Want to see similar homes?</p>
             <input id="feedback-wantsSimilar" type="hidden" value="" />
             <div class="flex justify-center gap-12 mb-10">
                 <button id="similar-no" type="button" class="text-5xl opacity-20 grayscale transition-all duration-300" title="No">👎</button>
                 <button id="similar-yes" type="button" class="text-5xl opacity-20 grayscale transition-all duration-300" title="Yes">👍</button>
             </div>
             
             <!-- Text feedback fields -->
             <textarea id="feedback-liked" rows="2" class="w-full bg-ink_black/50 border border-white/10 rounded-2xl p-5 text-white mb-6 outline-none" placeholder="What did you like?"></textarea>
             <textarea id="feedback-disliked" rows="2" class="w-full bg-ink_black/50 border border-white/10 rounded-2xl p-5 text-white mb-8 outline-none" placeholder="What didn't you like?"></textarea>
             <button id="btn-submit-feedback" class="w-full bg-lemon_lime text-ink_black py-5 rounded-2xl font-black text-xl">Submit</button>
        </div>
    </main>

    <footer class="mt-auto py-12 opacity-20">
        <p class="text-[9px] uppercase tracking-[0.5em] text-air_force_blue-900 font-bold">Presence // 2026</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
