<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flypost | Presence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink_black: '#060810',
                        hot_berry: '#d82e7e',
                        dark_amethyst: '#2f195f',
                        mint_leaf: '#40c9a2',
                        lemon_lime: '#e0e03e',
                        bright_snow: '#f7f7f7',
                        air_force_blue: '#628395'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #060810; color: #f7f7f7; font-family: ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .bg-glow { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100vw; height: 100vh; background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #060810 70%); z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); }
        .hidden { display: none; }
        .thumb-active { opacity: 1 !important; filter: grayscale(0) !important; transform: scale(1.2); }
        /* Prevent layout shift on mobile chrome */
        .min-h-screen { min-h: 100dvh; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-5 md:p-6 text-center">
    <div class="bg-glow"></div>

    <header class="flex flex-col items-center pt-12 md:pt-20 pb-8 md:pb-12 w-full max-w-4xl">
        <div class="text-white text-xl md:text-3xl font-black tracking-tighter mb-3 uppercase opacity-90">Flypost</div>
        <div class="w-full max-w-[120px] md:max-w-[280px] border-t border-white/10 mb-6 md:mb-8"></div>
        <div class="flex items-center justify-between w-full px-2 gap-2">
            <a href="https://ask.goflypost.com" class="text-[10px] md:text-sm font-bold text-air_force_blue-800 opacity-30 hover:opacity-100 transition-all uppercase tracking-[0.2em] w-1/4 text-right">Ask</a>
            <h1 class="text-[clamp(2.2rem,10vw,7rem)] font-black text-lemon_lime uppercase tracking-tighter w-2/4 leading-none">Presence</h1>
            <a href="https://post.goflypost.com" class="text-[10px] md:text-sm font-bold text-air_force_blue-800 opacity-30 hover:opacity-100 transition-all uppercase tracking-[0.2em] w-1/4 text-left">Post</a>
        </div>
    </header>

    <main class="max-w-xl w-full mt-4 md:mt-10">
        <div id="view-checkin" class="glass-card p-8 md:p-10 rounded-[2.5rem] md:rounded-3xl border-lemon_lime/10">
            <h2 class="text-2xl md:text-3xl font-bold mb-4 md:mb-6 italic tracking-tight">Arrived?</h2>
            <p class="text-air_force_blue-700 text-sm md:text-base mb-8 md:mb-10">Check in to receive property details.</p>
            <button id="btn-checkin" class="w-full bg-lemon_lime text-ink_black py-5 md:py-6 rounded-2xl font-black text-xl md:text-2xl shadow-xl shadow-lemon_lime/20 active:scale-95 transition-all uppercase tracking-tight">Check In Now</button>
            <p id="status-msg" class="mt-4 text-[10px] uppercase tracking-[0.2em] text-air_force_blue-900"></p>
        </div>

        <div id="view-success" class="hidden">
            <div class="w-16 h-16 md:w-20 md:h-20 bg-mint_leaf rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-mint_leaf/20">
                <svg class="w-8 h-8 md:w-10 md:h-10 text-ink_black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-3xl md:text-4xl font-black mb-8 tracking-tighter">You're In.</h2>
            <div class="space-y-3 md:space-y-4 px-4">
                <button id="btn-copy-link" class="w-full glass-card py-4 rounded-xl font-bold active:bg-white/10 transition text-sm md:text-base">Copy Feedback Link</button>
                <a id="sms-link" href="#" class="block w-full bg-hot_berry py-4 rounded-xl font-bold text-bright_snow text-sm md:text-base shadow-lg shadow-hot_berry/20">Text me the Link</a>
                <button id="btn-open-feedback" class="w-full border border-white/5 py-4 rounded-xl font-bold text-air_force_blue-700 text-xs md:text-sm uppercase tracking-widest">Leave Feedback</button>
            </div>
        </div>

        <div id="view-feedback" class="hidden glass-card p-8 rounded-[2.5rem] mt-4 text-left border-white/5">
             <h2 class="text-xl md:text-2xl font-black mb-6 uppercase tracking-tight">Feedback</h2>
             
             <label class="block text-[9px] md:text-xs uppercase tracking-[0.2em] text-air_force_blue-800 mb-2 ml-1">How did this house make you feel?</label>
             <textarea id="feedback-liked" rows="2" class="w-full bg-ink_black/50 border border-white/10 rounded-xl p-4 text-white mb-6 focus:border-lemon_lime/50 outline-none transition-all text-sm" placeholder="It felt..."></textarea>
             
             <label class="block text-[9px] md:text-xs uppercase tracking-[0.2em] text-air_force_blue-800 mb-2 ml-1">What didn't you like?</label>
             <textarea id="feedback-disliked" rows="2" class="w-full bg-ink_black/50 border border-white/10 rounded-xl p-4 text-white mb-8 focus:border-lemon_lime/50 outline-none transition-all text-sm" placeholder="The..."></textarea>
             
             <div class="flex flex-col items-center mb-8">
                 <p class="text-[10px] md:text-xs font-bold text-bright_snow uppercase tracking-widest mb-4">Show me more like this?</p>
                 <div class="flex gap-10">
                     <button id="thumb-down" type="button" class="text-4xl md:text-5xl opacity-30 grayscale hover:opacity-100 active:scale-125 transition-all duration-300">👎</button>
                     <button id="thumb-up" type="button" class="text-4xl md:text-5xl opacity-30 grayscale hover:opacity-100 active:scale-125 transition-all duration-300">👍</button>
                 </div>
                 <input type="hidden" id="feedback-wantsSimilar" value="false">
             </div>

             <button id="btn-submit-feedback" class="w-full bg-lemon_lime text-ink_black py-4 rounded-xl font-black text-lg active:scale-95 transition-all shadow-xl shadow-lemon_lime/10">Submit Feedback</button>
        </div>
    </main>

    <footer class="mt-auto py-10 opacity-40">
        <p class="text-[8px] uppercase tracking-[0.4em] text-air_force_blue-900">Flypost Presence // 2026</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
