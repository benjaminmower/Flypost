<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flypost | Presence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink_black: '#060810',
                        hot_berry: '#d82e7e',
                        dark_amethyst: '#2f195f',
                        mint_leaf: '#40c9a2',
                        lemon_lime: '#e0e03e',
                        bright_snow: '#f7f7f7',
                        air_force_blue: '#628395'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #060810; color: #f7f7f7; font-family: ui-sans-serif, system-ui, sans-serif; overflow-x: hidden; }
        .bg-glow { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100vw; height: 100vh; background: radial-gradient(circle at 50% -20%, #2f195f 0%, #060810 80%); z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); }
        .hidden { display: none; }
        .rocker-active { transform: translateY(-4px); transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center">
    <div class="bg-glow"></div>

    <nav class="absolute top-12 w-full flex justify-center items-center gap-6 md:gap-12">
        <a href="https://ask.goflypost.com" class="opacity-30 hover:opacity-100 text-sm font-bold uppercase tracking-widest transition-all">Ask</a>
        <div class="flex flex-col items-center rocker-active">
            <div class="font-black text-2xl tracking-tighter text-bright_snow mb-1">FLYPOST</div>
            <div class="text-4xl font-black text-lemon_lime uppercase tracking-tighter border-t border-lemon_lime/30 pt-1">PRESENCE</div>
        </div>
        <a href="https://post.goflypost.com" class="opacity-30 hover:opacity-100 text-sm font-bold uppercase tracking-widest transition-all">Drop</a>
    </nav>

    <main class="max-w-xl w-full mt-24">
        
        <div id="view-checkin">
            <h1 class="text-5xl font-black mb-6 tracking-tighter italic">Arrived?</h1>
            <p class="text-air_force_blue-700 text-lg mb-10">Check in to this open house to receive property details and provide feedback.</p>
            <button onclick="handleCheckIn()" id="btn-checkin" class="w-full bg-lemon_lime text-ink_black py-6 rounded-2xl font-black text-2xl shadow-xl shadow-lemon_lime/20 hover:scale-[1.02] transition-transform">
                CHECK IN NOW
            </button>
            <p id="status-msg" class="mt-4 text-xs text-air_force_blue-900 uppercase tracking-widest"></p>
        </div>

        <div id="view-success" class="hidden">
            <div class="w-20 h-20 bg-mint_leaf rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg shadow-mint_leaf/20">
                <svg class="w-10 h-10 text-ink_black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h1 class="text-4xl font-black mb-4 tracking-tighter">You're checked in!</h1>
            <p class="text-air_force_blue-700 mb-10 italic">Thank you for visiting. Use the links below to share your thoughts.</p>
            
            <div class="space-y-4">
                <button onclick="copyFeedbackLink()" class="w-full glass-card py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-white/10 transition">
                    <span>Copy Feedback Link</span>
                </button>
                <a id="sms-link" href="#" class="block w-full bg-hot_berry py-4 rounded-xl font-bold text-bright_snow shadow-lg shadow-hot_berry/20 hover:brightness-110 transition">
                    Text me the Link
                </a>
            </div>
        </div>

        <div id="view-feedback" class="hidden">
            <h1 class="text-4xl font-black mb-6 tracking-tighter">How did it feel?</h1>
            <div class="glass-card p-6 rounded-2xl text-left">
                <label class="block text-xs font-bold text-air_force_blue-800 uppercase tracking-widest mb-4">Your Experience</label>
                <textarea id="feedback-text" rows="4" class="w-full bg-ink_black border border-white/10 rounded-xl p-4 text-bright_snow focus:border-lemon_lime outline-none" placeholder="What did you love (or hate) about the property?"></textarea>
                <button onclick="submitFeedback()" class="w-full mt-6 bg-lemon_lime text-ink_black py-4 rounded-xl font-black text-lg">
                    Submit Feedback
                </button>
            </div>
        </div>

    </main>

    <script>
        // 1. Token Management
        const getBuyerToken = () => {
            let token = localStorage.getItem('buyerToken');
            if (!token) {
                token = 'ulid_' + Math.random().toString(36).substr(2, 9); // Simple ULID-like fallback
                localStorage.setItem('buyerToken', token);
            }
            return token;
        };

        // 2. Navigation / Routing Logic
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const feedbackToken = window.location.pathname.split('/f/')[1] || urlParams.get('f');
            
            if (feedbackToken) {
                showView('view-feedback');
                window.currentFeedbackToken = feedbackToken;
            }
        };

        const showView = (viewId) => {
            ['view-checkin', 'view-success', 'view-feedback'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        };

        // 3. API Actions
        async function handleCheckIn() {
            const status = document.getElementById('status-msg');
            const btn = document.getElementById('btn-checkin');
            
            status.innerText = "Requesting location...";
            btn.disabled = true;
            btn.style.opacity = "0.5";

            navigator.geolocation.getCurrentPosition(async (pos) => {
                const payload = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    buyerToken: getBuyerToken(),
                    method: "geo_time"
                };

                try {
                    status.innerText = "Checking in...";
                    const response = await fetch('https://api.goflypost.com/v1/presence/check-in', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();

                    if (response.ok) {
                        window.feedbackUrl = data.feedbackLink || `https://presence.goflypost.com/f/${data.attendanceId}`;
                        document.getElementById('sms-link').href = `sms:&body=Here is your Flypost feedback link: ${window.feedbackUrl}`;
                        showView('view-success');
                    } else {
                        status.innerText = "Check-in failed. Try again.";
                    }
                } catch (e) {
                    status.innerText = "API Error. Please refresh.";
                }
            }, (err) => {
                status.innerText = "Location access required.";
                btn.disabled = false;
                btn.style.opacity = "1";
            });
        }

        async function submitFeedback() {
            const feedback = document.getElementById('feedback-text').value;
            const payload = {
                feedbackToken: window.currentFeedbackToken,
                content: feedback
            };

            const response = await fetch('https://api.goflypost.com/v1/presence/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert("Feedback sent! Thank you.");
                window.location.href = "https://ask.goflypost.com";
            }
        }

        function copyFeedbackLink() {
            navigator.clipboard.writeText(window.feedbackUrl);
            alert("Link copied to clipboard!");
        }
    </script>
</body>
</html>
