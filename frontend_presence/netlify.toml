# Netlify configuration for Flypost Presence site
# Deploy this at presence.goflypost.com

[build]
  base = "frontend_presence"
  command = "npm install && npm run build"
  publish = "dist"

[[redirects]]
  from = "/f/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
